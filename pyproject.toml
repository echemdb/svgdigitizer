[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "svgdigitizer"
version = "0.15.0"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
description = "svgdigitizer is a Python library and command line tool to recover the measured data underlying plots in scientific publications."
readme = "README.md"
requires-python = ">=3.11"
# Additions and removals of dependencies need to be reflected in flake.nix
dependencies = [
    "astropy>=5.0.5,<9",
    "click>=8,<9",
    "frictionless>=5.8.3,<6",
    "latexcodec>=2.0.1",
    "matplotlib>=3.6,<4",
    "mergedeep>=1.3.4,<2",
    "pandas>=1.5,<4",
    "pillow>=9.2,<13",
    "pybtex>=0.25,<0.27",
    "pymupdf>=1.27.1,<2",
    "pyyaml>=6,<7",
    "requests>2,<3",
    "scipy>=1.9.2,<2",
    "svg.path>=4.1,<8",
    "svgpathtools>=1.4,<2",
    "svgwrite>=1.4,<2",
]


[project.scripts]
svgdigitizer = "svgdigitizer.entrypoint:cli"

[tool.setuptools]
packages = [
    "svgdigitizer",
    "svgdigitizer.assets",
    "svgdigitizer.electrochemistry",
    "svgdigitizer.test",
]

[tool.setuptools.package-data]
"svgdigitizer.assets" = ["template_basic.svg"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.environments]
python-311 = ["test", "python-311"]
python-312 = ["test", "python-312"]
python-313 = ["test", "python-313"]
python-314 = ["test", "python-314"]
dev = ["dev", "doc", "test", "lint"]
release = ["release"]
cff = { features = ["cff"], no-default-feature = true }

[tool.pixi.dependencies]
astropy = "*"
click = "*"
frictionless = "*"
latexcodec = "*"
matplotlib-base = "*"
mergedeep = "*"
pandas = "*"
pillow = "*"
poppler = "*"
pybtex = "*"
python = "*"
pyyaml = "*"
requests = "*"
scipy = "*"
"svg.path" = "*"
svgpathtools = "*"
svgwrite = "*"
jupyterlab = ">=4.3.4,<5"
jupytext = ">=1.16.6,<2"

[tool.pixi.tasks]
svgdigitizer = "svgdigitizer"

[tool.pixi.pypi-dependencies]
svgdigitizer = { path = ".", editable = true }

[tool.pixi.feature.python-311.dependencies]
python = "3.11.*"

[tool.pixi.feature.python-312.dependencies]
python = "3.12.*"

[tool.pixi.feature.python-313.dependencies]
python = "3.13.*"

[tool.pixi.feature.python-314.dependencies]
python = "3.14.*"

[tool.pixi.feature.test.dependencies]
check-jsonschema = "*"
pytest = "*"
pytest-xdist = "*"
pytest-env = "*"

[tool.pixi.feature.test.tasks]
# To validate the metadata against a specific version preceded the version by `tags` such as `tags/0.8.4`.
# To validate the metadata against metadata in a specific branch use `head/branch-name`.
validate = { args = [ { "arg" = "version", "default" = "tags/0.9.0" } ],cmd = "check-jsonschema --schemafile https://raw.githubusercontent.com/echemdb/metadata-schema/refs/{{ version }}/schemas/svgdigitizer_package.json --base-uri https://raw.githubusercontent.com/echemdb/metadata-schema/refs/{{ version }}/schemas/svgdigitizer_package.json --no-cache $(find ./test/data/ -type f -name '*.json.expected')" }
doctest = "pytest -n auto --doctest-modules svgdigitizer"
pytest = "pytest -n auto svgdigitizer/**/*.py"

[tool.pixi.feature.lint.dependencies]
black = "*"
isort = "*"
pylint = "*"

[tool.pixi.feature.lint.tasks]
pylint = "pylint svgdigitizer"
black = "black svgdigitizer"
isort = "isort --profile black svgdigitizer"
lint = { depends-on = ["pylint", "black", "isort"] }

# cffconvert requires jsonschema<4, which conflicts with check-jsonschema in the
# test feature, so it lives in its own environment.
[tool.pixi.feature.cff.dependencies]
cffconvert = "*"

[tool.pixi.feature.cff.tasks]
cff = "cffconvert --validate -i CITATION.cff"

[tool.pixi.feature.doc.dependencies]
make = "*"
myst-parser = "*"
myst-nb = "*"
sphinx = "*"
sphinx-design = "*"
sphinx_rtd_theme = "*"

[tool.pixi.feature.doc.tasks]
doc = "cd doc && make html SPHINXOPTS='-W -n --keep-going'"
linkcheck = "cd doc && make linkcheck"

[tool.pixi.feature.dev.dependencies]
pip = "*"
python = "3.14.*"

[tool.pixi.feature.release.tasks]
# To create a new release, run `pixi run rever X.Y.Z`
# PYTHONUTF8 makes rever read files as UTF-8 on Windows (where the default is cp1252).
rever = { args = [ { "arg" = "version", "default" = "--help" } ], cmd = "rever {{ version }}", env = { PYTHONUTF8 = "1" } }

[tool.pixi.feature.release.dependencies]
twine = "*"
rever = "*"
make = "*"

[tool.pixi.feature.release.pypi-dependencies]
build = "*"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*builtin type swigvarlink has no __module__ attribute.*:DeprecationWarning::",
    "ignore:.*builtin type SwigPyObject has no __module__ attribute.*:DeprecationWarning::",
    "ignore:.*builtin type SwigPyPacked has no __module__ attribute.*:DeprecationWarning::",
]
env = [
    "MPLBACKEND=Agg"
]
